services:
  price-tracker:
    build:
      context: .
      args:
        WITH_PLAYWRIGHT: "false"   # "true" adds headless Chromium (~450 MB) for bot-walled shops
    image: price-tracker:local
    container_name: price-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Zurich
    volumes:
      - ./data:/data                  # SQLite history + state
      - ./products:/config/products   # product definitions (edit, then restart)
    ports:
      - "8099:8099"                   # status page: http://<nas-ip>:8099/  (WEB_PORT=0 disables)
    mem_limit: 512m                   # 1500m when WITH_PLAYWRIGHT=true
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
