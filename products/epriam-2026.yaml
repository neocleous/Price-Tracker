# Shown on the status page.
coverage_notes:
  - "Shops tracked (2026-11-05): Cybex CH/DE, baby-walz CH/DE, MY SNOWFLAKE CH, Kindermaxx DE (EUR to the parcel box, and its CHF Swiss storefront delivered home DDP via MeinEinkauf.ch), mypram DE, Bambinou FR."
  - "Kindermaxx → CH (DDP): select 'Fr Swiss francs' on kindermaxx.de; prices then include Swiss VAT and customs clearance; CHF 12.95 shipping per order (the tracker counts it per item, so a multi-item order is up to CHF 26 cheaper than shown)."
  - "Bot-walled for a plain HTTP client (403/503): galaxus.ch, toppreise.ch, idealo.de, geizhals.de, tausendkind.ch, amazon.de — need the Playwright build (WITH_PLAYWRIGHT=true) and a residential IP."
  - "babymarkt.de and baby-walz.de return 429 from datacenter IPs; baby-walz.de works from the NAS, babymarkt.de still needs product URLs."
  - "babyone.de, kidsroom.de, windeln.de, babyartikel.de, babyprofi.de, babyjoe.ch, baby-rose.ch, orchestra.ch, manor.ch: JS-only search and no 2026 e-Priam product URLs found — add direct product URLs when known."
  - "Cybex sells the 2026 Seat Pack and Fold Lux Carry Cot only inside the set configurator (no standalone pages in CH/DE)."
  - "Priam Lite Cot: no 2026 / New Generation listings found anywhere — tracked as optional with no sources."
