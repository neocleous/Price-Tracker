name: build-image
on:
  push:
    branches: [main]
    paths: ["tracker/**", "pyproject.toml", "Dockerfile", ".github/workflows/build-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/price-tracker:latest
            ghcr.io/${{ github.repository_owner }}/price-tracker:${{ github.sha }}
          build-args: WITH_PLAYWRIGHT=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
